<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>SmartBot AI Chatbot</title>

  <link rel="stylesheet" href="/style.css">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.1/dist/purify.min.js" defer></script>
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo">🤖</div>
      <div class="brand">
        <h1>SmartBot AI</h1>
        <p>Your friendly AI assistant</p>
      </div>
      <span class="status">● Ready</span>
    </header>

    <section id="chat-box" class="chat-box"
      aria-label="Chat messages" aria-live="polite">
      <div class="message bot">
        <strong>SmartBot</strong>
        <p>Hello! 👋 I'm SmartBot. Ask me anything!</p>
      </div>
    </section>

    <div id="typing" class="typing" hidden>
      SmartBot is thinking...
    </div>

    <form id="chat-form" class="chat-form">
      <label class="sr-only" for="user-input">Your message</label>
      <input
        id="user-input"
        type="text"
        placeholder="Type your message..."
        maxlength="4000"
        autocomplete="off"
        required
      >
      <button id="send-button" type="submit">Send ➤</button>
    </form>

    <footer>Powered by Groq AI · AI can make mistakes</footer>
  </main>
</body>
</html>
